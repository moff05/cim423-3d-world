<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VR Projects | Nicholas Moffett</title>
<meta name="description" content="{{ site.description }}">
<style>
  :root {
    color-scheme: light;
    --bg: #FBF3EC;
    --text: #3B2A26;
    --muted: #93726A;
    --rule: #E9D2C4;
    --rust: #A2574F;
    --orange: #E68057;
    --mauve: #BF7587;
    --purple: #993A8B;
    --accent: var(--rust);
    --quote-bg: #F3E3D6;
    --code-bg: #F0E1D4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.65;
  }
  main {
    max-width: 700px;
    margin: 1.5rem auto 3rem;
    padding: 2.5rem 1.75rem 3.5rem;
    counter-reset: chapter;
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 14px;
    box-shadow: 0 4px 28px rgba(59, 38, 30, 0.07);
  }
  header.site-header {
    max-width: 700px;
    margin: 1.5rem auto 0;
    padding: 2.25rem 1.75rem;
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 14px;
    box-shadow: 0 4px 28px rgba(59, 38, 30, 0.07);
  }
  header.site-header .eyebrow {
    display: block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--purple);
    margin-bottom: 0.7rem;
  }
  header.site-header h1 {
    font-size: 2rem;
    margin: 0 0 0.9rem;
    letter-spacing: -0.02em;
    color: var(--rust);
    background: linear-gradient(90deg, var(--rust), var(--orange) 55%, var(--purple));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header.site-header .accent-bar {
    width: 52px;
    height: 4px;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--rust), var(--orange), var(--purple));
  }
  header.site-header p {
    color: var(--muted);
    margin: 0;
    font-size: 1.02rem;
  }
  h1, h3, h4 { letter-spacing: -0.01em; }
  h2 {
    counter-increment: chapter;
    font-size: 1.6rem;
    margin: 0 0 1.5rem;
    padding-top: 3.5rem;
    letter-spacing: -0.01em;
    scroll-margin-top: 4.5rem;
  }
  h2::before {
    counter-increment: none;
    content: "Assignment " counter(chapter, decimal-leading-zero);
    display: block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--purple);
    margin-bottom: 0.6rem;
  }
  .project-banner {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--purple);
    margin: 2.5rem 0 0.5rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid var(--purple);
    scroll-margin-top: 4.5rem;
  }
  h2.proj::before { content: "Project 2"; }
  .chapter-date {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 0.9rem 0 0.8rem;
  }
  main > h2:not(:first-of-type) {
    border-top: 1px solid var(--rule);
  }
  main > h2:first-of-type {
    padding-top: 0;
  }
  h3 { font-size: 1.1rem; margin-top: 2rem; color: var(--rust); scroll-margin-top: 4.5rem; }
  h4 { font-size: 0.95rem; margin-top: 1.4rem; color: var(--muted); }
  p, li { font-size: 1.02rem; }
  a { color: var(--purple); text-decoration: none; border-bottom: 1px solid currentColor; }
  a:hover { opacity: 0.75; }
  blockquote {
    margin: 1.1rem 0;
    padding: 0.65rem 1.1rem;
    background: var(--quote-bg);
    border-left: 3px solid var(--orange);
    border-radius: 4px;
  }
  blockquote p { margin: 0.3rem 0; font-size: 0.98rem; }
  code {
    background: var(--code-bg);
    padding: 0.15em 0.4em;
    border-radius: 4px;
    font-size: 0.9em;
  }
  hr {
    border: none;
    border-top: 1px solid var(--rule);
    margin: 1.8rem 0;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
    margin: 1.2rem 0;
    display: block;
    overflow-x: auto;
  }
  th, td {
    text-align: left;
    padding: 0.5rem 0.7rem;
    border-bottom: 1px solid var(--rule);
    white-space: normal;
  }
  th { color: var(--muted); font-weight: 600; }
  img { max-width: 100%; border-radius: 6px; }
  em.placeholder {
    color: var(--muted);
  }
  header.site-header p.repo-link { margin: 1.1rem 0 0; font-size: 0.95rem; }
  .chapter-nav {
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .chapter-nav-inner {
    max-width: 700px;
    margin: 0 auto;
    padding: 0.7rem 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.4rem 1.25rem;
    flex-wrap: wrap;
    font-size: 0.85rem;
    background: var(--bg);
    border-bottom: 1px solid var(--rule);
  }
  .chapter-nav a {
    color: var(--rust);
    border-bottom: none;
    font-weight: 600;
  }
  .chapter-nav a:hover { opacity: 0.7; }
  .chapter-nav .nav-top {
    margin-left: auto;
    color: var(--muted);
    font-weight: 500;
  }
  footer {
    max-width: 700px;
    margin: 0 auto;
    padding: 0 1.25rem 3rem;
    color: var(--muted);
    font-size: 0.85rem;
  }
  .space-decor {
    display: none;
  }
  @media (min-width: 1150px) {
    .space-decor {
      display: block;
    }
    .space-rail {
      position: fixed;
      top: 0;
      bottom: 0;
      width: calc((100vw - 748px) / 2);
      z-index: -1;
      pointer-events: none;
      opacity: 0.5;
      background-image: url("{{ '/assets/images/space/tile.png' | relative_url }}");
      background-repeat: repeat;
      background-position: top left;
    }
    .space-rail.left { left: 0; }
    .space-rail.right { right: 0; transform: scaleX(-1); }
  }
  .chapter-nav-inner .tabs { display: flex; gap: 0.5rem; }
  .chapter-nav .tab {
    display: flex; flex-direction: column; line-height: 1.2;
    padding: 0.4rem 0.9rem; border: 1px solid var(--rule); border-radius: 8px;
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted);
  }
  .chapter-nav .tab span { font-size: 0.95rem; text-transform: none; letter-spacing: 0; color: var(--rust); }
  .chapter-nav .tab.active { background: var(--rust); border-color: var(--rust); color: #fff; }
  .chapter-nav .tab.active span { color: #fff; }
  .chapter-nav .nav-gh { margin-left: auto; }
  .chapter-nav .nav-top { margin-left: 0; }
  .chapter-nav-sub { max-width: 700px; margin: 0 auto; padding: 0.45rem 1.25rem; background: var(--bg); border-bottom: 1px solid var(--rule); font-size: 0.82rem; }
  .chapter-nav-sub .sub { display: none; gap: 0.3rem 1.25rem; flex-wrap: wrap; }
  .chapter-nav-sub .sub.active { display: flex; }
  .chapter-nav-sub a { font-weight: 500; }
  .chapter-nav-inner { border-bottom: none; }
  .proj-hidden { display: none !important; }
</style>
</head>
<body id="top">
<div class="space-decor" aria-hidden="true">
  <div class="space-rail left"></div>
  <div class="space-rail right"></div>
</div>
<header class="site-header">
  <span class="eyebrow">University of Miami · Nicholas Moffett</span>
  <h1>VR Projects</h1>
  <div class="accent-bar"></div>
  <p class="repo-link"><a href="https://github.com/moff05/cim423-unity-project">Day 181 documentation &amp; source on GitHub ↗</a></p>
</header>
<nav class="chapter-nav">
  <div class="chapter-nav-inner">
    <div class="tabs">
      <a href="#project-1" class="tab" data-project="1">Project 1<span>Day 181</span></a>
      <a href="#project-2" class="tab" data-project="2">Project 2<span>Music World</span></a>
    </div>
    <a href="https://github.com/moff05/cim423-unity-project" class="nav-gh">GitHub ↗</a>
    <a href="#top" class="nav-top">↑ Top</a>
  </div>
  <div class="chapter-nav-sub">
    <div class="sub" data-project="1">
      <a href="#assignment-1">Story</a>
      <a href="#assignment-2">3D World</a>
      <a href="#assignment-3">Interactions</a>
    </div>
    <div class="sub" data-project="2">
      <a href="#project-description">Description</a>
      <a href="#spatial-design">Spatial Design</a>
      <a href="#collaborative-features">Collaboration</a>
      <a href="#interactions">Interactions</a>
      <a href="#community-and-return-visits">Community</a>
    </div>
  </div>
</nav>
<main>
  {{ content }}
</main>
<footer>
  {{ site.footer }}
</footer>
<script>
(function () {
  function easeOutExpo(t) {
    return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
  }

  function animateScrollTo(targetY, duration) {
    var startY = window.scrollY;
    var diff = targetY - startY;
    var startTime = null;

    function step(timestamp) {
      if (startTime === null) startTime = timestamp;
      var progress = Math.min((timestamp - startTime) / duration, 1);
      window.scrollTo(0, startY + diff * easeOutExpo(progress));
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  var navEl = document.querySelector('.chapter-nav');
  var links = document.querySelectorAll('.chapter-nav a[href^="#"]:not(.tab)');

  links.forEach(function (link) {
    link.addEventListener('click', function (e) {
      var id = link.getAttribute('href').slice(1);
      if (window.showForId) window.showForId(id);
      var target = document.getElementById(id);
      if (!target) return;
      e.preventDefault();

      var targetY;
      if (id === 'top') {
        targetY = 0;
      } else {
        var navHeight = navEl ? navEl.getBoundingClientRect().height : 0;
        targetY = target.getBoundingClientRect().top + window.scrollY - navHeight - 16;
      }
      animateScrollTo(Math.max(0, targetY), 700);
      history.pushState(null, '', '#' + id);
    });
  });
})();

(function () {
  var main = document.querySelector('main');
  var kids = Array.prototype.slice.call(main.children);
  var group = 0;
  kids.forEach(function (el) {
    if (el.id === 'project-1') group = 1;
    if (el.id === 'project-2') group = 2;
    el.setAttribute('data-group', group);
  });
  function show(n, scroll) {
    kids.forEach(function (el) {
      el.classList.toggle('proj-hidden', el.getAttribute('data-group') !== String(n));
    });
    document.querySelectorAll('.tab, .sub').forEach(function (el) {
      el.classList.toggle('active', el.getAttribute('data-project') === String(n));
    });
    if (scroll) window.scrollTo(0, 0);
  }
  function groupOf(id) {
    var t = id && document.getElementById(id);
    return t && t.closest('main') ? t.getAttribute('data-group') || (t.closest('[data-group]') || {getAttribute: function () {}}).getAttribute('data-group') : null;
  }
  document.querySelectorAll('.tab').forEach(function (tab) {
    tab.addEventListener('click', function (e) {
      e.preventDefault();
      var n = tab.getAttribute('data-project');
      show(n, true);
      history.pushState(null, '', '#project-' + n);
    });
  });
  document.querySelectorAll('.chapter-nav-sub a').forEach(function (a) {
    a.addEventListener('click', function () {
      var g = groupOf(a.getAttribute('href').slice(1));
      if (g) show(g, false);
    });
  });
  window.showForId = function (id) { var g = groupOf(id); if (g) show(g, false); };
  var start = groupOf(location.hash.slice(1)) || 1;
  show(start, false);
  if (location.hash && document.getElementById(location.hash.slice(1))) {
    setTimeout(function () { document.getElementById(location.hash.slice(1)).scrollIntoView(); }, 0);
  }
})();
</script>
</body>
</html>
