<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fdfcfa;
    --text: #1b1b1b;
    --muted: #6b6b6b;
    --rule: #e4e0d9;
    --accent: #8a5cf6;
    --quote-bg: #f4f1ec;
    --code-bg: #f0eee9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16151a;
      --text: #ececec;
      --muted: #9a9a9a;
      --rule: #302e35;
      --accent: #b39bfa;
      --quote-bg: #201f26;
      --code-bg: #201f26;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.65;
  }
  main {
    max-width: 700px;
    margin: 0 auto;
    padding: 3rem 1.25rem 5rem;
  }
  header.site-header {
    max-width: 700px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 0;
  }
  header.site-header h1 {
    font-size: 1.75rem;
    margin: 0 0 0.4rem;
    letter-spacing: -0.01em;
  }
  header.site-header p {
    color: var(--muted);
    margin: 0;
    font-size: 1.02rem;
  }
  h1, h2, h3, h4 { letter-spacing: -0.01em; }
  h2 {
    font-size: 1.5rem;
    margin-top: 3rem;
    padding-top: 2rem;
    border-top: 1px solid var(--rule);
  }
  main > h2:first-of-type { border-top: none; padding-top: 0; }
  h3 { font-size: 1.15rem; margin-top: 2.2rem; }
  h4 { font-size: 1rem; margin-top: 1.6rem; color: var(--muted); }
  p, li { font-size: 1.02rem; }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid currentColor; }
  a:hover { opacity: 0.8; }
  blockquote {
    margin: 1.2rem 0;
    padding: 0.7rem 1.1rem;
    background: var(--quote-bg);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
  }
  blockquote p { margin: 0.3rem 0; font-size: 0.98rem; }
  code {
    background: var(--code-bg);
    padding: 0.15em 0.4em;
    border-radius: 4px;
    font-size: 0.9em;
  }
  hr {
    border: none;
    border-top: 1px solid var(--rule);
    margin: 2.2rem 0;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.92rem;
    margin: 1.2rem 0;
    display: block;
    overflow-x: auto;
  }
  th, td {
    text-align: left;
    padding: 0.5rem 0.7rem;
    border-bottom: 1px solid var(--rule);
    white-space: normal;
  }
  th { color: var(--muted); font-weight: 600; }
  img { max-width: 100%; border-radius: 6px; }
  footer {
    max-width: 700px;
    margin: 0 auto;
    padding: 0 1.25rem 3rem;
    color: var(--muted);
    font-size: 0.88rem;
  }
</style>
</head>
<body>
<header class="site-header">
  <h1>{{ site.title }}</h1>
  <p>{{ site.description }}</p>
</header>
<main>
  {{ content }}
</main>
<footer>
  {{ site.footer }}
</footer>
</body>
</html>
